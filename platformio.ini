; ============================================================
; Digital IC Checker — PlatformIO Configuration
; Target: ESP32-S3 N16R8 (16MB Flash, 8MB OPI PSRAM)
; Display: 2.8" ST7789 SPI TFT (320x240 landscape)
; Touch: XPT2046 (resistive, built into TFT_eSPI)
; ============================================================
[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ------ Flash & PSRAM ------
board_build.psram_type    = opi
board_upload.flash_size   = 16MB
board_build.flash_mode    = qio
board_build.partitions    = default_16MB.csv

; ------ Serial Monitor ------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ------ Libraries ------
lib_deps =
    lvgl/lvgl @ ^8.3.11
    bodmer/TFT_eSPI @ ^2.5.43

; ------ Build Flags ------
build_flags =
    ; --- USB CDC (for Serial over USB) ---
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; --- LVGL Config ---
    -I src
    -DLV_CONF_INCLUDE_SIMPLE=1

    ; --- TFT_eSPI: ST7789 Setup (replaces User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; TFT SPI Pins (SPI2 / FSPI on ESP32-S3)
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH

    ; XPT2046 Touch (shares SPI bus with TFT)
    -DTOUCH_CS=7

    ; Font loading (GFX free fonts for Sci-Fi look)
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; SPI Frequencies
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
    -DSPI_TOUCH_FREQUENCY=2500000

    ; Optimisation
    -O2

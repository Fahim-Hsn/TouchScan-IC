; ============================================================
; Digital IC Checker — PlatformIO Configuration
; Target: ESP32-S3 N16R8 (16MB Flash, 8MB OPI PSRAM)
; Display: 2.8" ST7789 SPI TFT (320x240 landscape)
; Touch: XPT2046 (resistive, built into TFT_eSPI)
; ============================================================
[env:esp32-s3-devkitc-1]
platform  = espressif32@6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

; ------ Flash ------
board_upload.flash_size   = 16MB
board_build.flash_mode    = qio
board_build.partitions    = default_16MB.csv

; ------ Serial Monitor ------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ------ Libraries ------
lib_deps =
    lvgl/lvgl @ ^8.3.11
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; ------ Build Flags ------
build_flags =
    ; --- USB CDC (for Serial over USB) ---
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; --- LVGL Config ---
    -I src
    -DLV_CONF_INCLUDE_SIMPLE=1

    ; Optimisation
    -O2
